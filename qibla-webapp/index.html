<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qibla Direction</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif; text-align: center; padding: 30px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        #arrow { font-size: 100px; display: inline-block; }
        #bearing { font-size: 22px; margin: 12px; font-weight: bold; }
        #heading { font-size: 18px; margin: 8px; }
        #status, #status2 { color: var(--tg-theme-hint-color, gray); font-size: 14px; }
        #enable {
            font-size: 16px; padding: 12px 24px; margin: 16px; border: none; border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body>
    <h1>Qibla Compass</h1>
    <div id="arrow">↑</div>
    <div id="bearing">-</div>
    <div id="heading">Phone heading: -</div>
    <button id="enable">Enable Compass</button>
    <div id="status">Getting your location...</div>
    <div id="status2"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const KAABA_LAT = 21.4225;
        const KAABA_LON = 39.8262;

        const toRad = (deg) => deg * Math.PI / 180;
        const toDeg = (rad) => rad * 180 / Math.PI;

        let qibla = null;
        let targetRotation = 0;
        let currentRotation = 0;

        function qiblaBearing(lat, lon){
            const dLon = toRad(KAABA_LON - lon);
            const lat1 = toRad(lat);
            const lat2 = toRad(KAABA_LAT);

            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);

            return (toDeg(Math.atan2(y, x)) + 360) % 360;
        }

        function showQibla(position){
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            qibla = qiblaBearing(lat, lon);

            document.getElementById("bearing").textContent =
                "Qibla: " + qibla.toFixed(0) + " Deg from North";
            document.getElementById("status").textContent =
                "You: " + lat.toFixed(4) + ", " + lon.toFixed(4);
        }

        function handleError(err){
            document.getElementById("status").textContent = 
                "Couldn't get location: " + err.message;
        }

        function handleOreintation(event){
            let heading;
            if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null){
                heading = event.webkitCompassHeading;
            } else if (event.alpha !== null){
                heading = 360 - event.alpha;
            } else {
                return;
            }

            document.getElementById("heading").textContent =
            "Phone heading: " + heading.toFixed(0) + "Deg";

            if (qibla !== null){
                targetRotation = qibla - heading;
            }
        }

        function animate(){
            let diff = targetRotation - currentRotation;
            diff = ((diff+540)%360) - 180;

            currentRotation += diff * 0.15;
            document.getElementById("arrow").style.transform =
            "rotate(" + currentRotation + "deg)";

            requestAnimationFrame(animate);
        }

        function startCompass(){
            if("ondeviceorientationabsolute" in window){
                window.addEventListener("deviceorientationabsolute", handleOreintation)
            } else {
                window.addEventListener("deviceorientation", handleOreintation)
            }
            document.getElementById("status2").textContent = "Compass activated"
        }

        function initCompass(){
            document.getElementById("enable").style.display = "inline-block";
        }

        function enableCompass(){
            if(typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function"
            ){
                DeviceOrientationEvent.requestPermission()
                    .then((state) => {
                        if (state === "granted"){
                            startCompass();
                        } else {
                            document.getElementById("status2").textContent = "Permission denied";
                        }
                    })
                    .catch((err) => {
                        document.getElementById("status2").textContent = "error: " + err;
                    })
            } else {
                startCompass();
            }
        }

        document.getElementById("enable").addEventListener("click", enableCompass);
        initCompass();

        if (navigator.geolocation){
            navigator.geolocation.getCurrentPosition(showQibla, handleError);
        } else {
            document.getElementById("status").textContent = "Geolocation not supported";
        }
        animate();
    </script>
    
</body>
</html>
